<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Adhérents - Bibliothèque de quartier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top-bar">
  <h1>Bibliothèque de quartier</h1>
  <nav class="main-nav">
    <a href="index.html">Tableau de bord</a>
    <a href="livres.html">Livres</a>
    <a href="auteurs.html">Auteurs</a>
    <a href="adherents.html" class="actif">Adhérents</a>
    <a href="emprunts.html">Emprunts</a>
  </nav>
</header>

<main>
  <h2>Adhérents</h2>

  <div class="carte">
    <h3 id="titre-formulaire">Ajouter un adhérent</h3>
    <div class="message-erreur" id="erreur-form"></div>
    <div class="message-succes" id="succes-form"></div>
    <form class="formulaire" id="form-adherent">
      <input type="hidden" id="adherent-id">
      <label>Nom
        <input type="text" id="adherent-nom" required>
      </label>
      <label>Prénom
        <input type="text" id="adherent-prenom" required>
      </label>
      <label>Contact (email ou téléphone)
        <input type="text" id="adherent-contact" required>
      </label>
      <div class="barre-outils">
        <button type="submit" id="bouton-submit">Ajouter</button>
        <button type="button" class="secondaire" id="bouton-annuler" style="display:none;">Annuler</button>
      </div>
    </form>
  </div>

  <div class="carte">
    <table>
      <thead>
        <tr>
          <th>Nom</th>
          <th>Prénom</th>
          <th>Contact</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="corps-tableau-adherents">
        <tr><td colspan="4" class="vide">Chargement...</td></tr>
      </tbody>
    </table>
  </div>

  <div class="carte" id="zone-historique" style="display:none;">
    <h3 id="titre-historique">Historique des emprunts</h3>
    <table>
      <thead>
        <tr>
          <th>Livre</th>
          <th>Date d'emprunt</th>
          <th>Retour prévu</th>
          <th>Statut</th>
        </tr>
      </thead>
      <tbody id="corps-tableau-historique"></tbody>
    </table>
  </div>
</main>

<script src="js/api.js"></script>
<script src="js/adherents.js"></script>
</body>
</html>
